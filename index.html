<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HaloStory AI">
  <meta name="apple-mobile-web-app-title" content="HaloStory AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HaloStory AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 1. Sembunyikan banner secara default (untuk desktop/layar besar) */
    #banner-container {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999999; 
      pointer-events: auto; 
      justify-content: center;
    }

    /* 2. Tampilkan banner hanya jika lebar layar 768px ke bawah (ukuran mobile/tablet portrait) */
    @media (max-width: 768px) {
      #banner-container {
        display: flex; /* Mengubah dari none menjadi flex agar muncul */
      }
    }
  </style>
</head>
<body>
  <div id="banner-container">
    <script src="https://keepandroidopen.org/banner.js" async></script>
    </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
